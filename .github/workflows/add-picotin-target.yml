name: Add Picotin target once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/add-picotin-target.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Picotin target and regression test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/hermes.mjs')
          s = p.read_text()
          needle = '  /\\bconstance\\b/i,\n'
          addition = '  /\\bpicotin\\b/i,\n'
          if addition not in s:
              if needle not in s:
                  raise SystemExit('target insertion point not found')
              s = s.replace(needle, addition + needle, 1)
              p.write_text(s)

          t = Path('test/picotin.test.mjs')
          t.write_text('''import test from "node:test";\nimport assert from "node:assert/strict";\nimport { isTargetProduct } from "../src/hermes.mjs";\n\ntest("Picotin / Picotin Lock variants are target bags", () => {\n  for (const name of [\n    "Picotin Lock 18 bag",\n    "Picotin Lock 22 bag",\n    "Picotin Lock 26 bag",\n    "Picotin bag",\n  ]) {\n    assert.equal(isTargetProduct(name), true, name);\n  }\n});\n''')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            exit 0
          fi
          git add src/hermes.mjs test/picotin.test.mjs
          git commit -m "feat: monitor Picotin bags [skip ci]"
          git push
