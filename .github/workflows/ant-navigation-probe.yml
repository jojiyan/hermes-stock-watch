name: ScrapingAnt Navigation Probe

on:
  push:
    branches: [main]
    paths:
      - "src/ant-navigation-probe.mjs"
      - ".github/workflows/ant-navigation-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Navigate from category to product
        run: node src/ant-navigation-probe.mjs
        env:
          SCRAPINGANT_API_KEY: ${{ secrets.SCRAPINGANT_API_KEY }}
