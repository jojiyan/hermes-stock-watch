name: Hermès stock state regression tests

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ant-stock-state-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
      - run: node --check src/ant-monitor.mjs
