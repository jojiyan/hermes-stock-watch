name: Hermès stock state regression tests

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ant-stock-state-tests.yml"
      - "src/ant-monitor.mjs"
      - "src/ant-stock-state.mjs"
      - "src/ant-retry.mjs"
      - "test/ant-retry.test.mjs"
      - "src/ant-catalog.mjs"
      - "src/ant-catalog-monitor.mjs"
      - "src/ant-catalog-fetch.mjs"
      - "test/ant-catalog-fetch.test.mjs"
      - "test/ant-catalog.test.mjs"
      - "test/ant-stock-state.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
      - run: node --check src/ant-monitor.mjs
      - run: node --check src/ant-catalog-monitor.mjs
