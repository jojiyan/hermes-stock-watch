name: ScrapingAnt XHR Probe

on:
  push:
    branches: [main]
    paths:
      - "src/ant-xhr-probe.mjs"
      - ".github/workflows/ant-xhr-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Probe Hermès CA XHRs
        run: node src/ant-xhr-probe.mjs
        env:
          SCRAPINGANT_API_KEY: ${{ secrets.SCRAPINGANT_API_KEY }}
      - name: Upload probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ant-xhr-probe-${{ github.run_id }}
          path: ant-xhr-probe.json
          retention-days: 1
