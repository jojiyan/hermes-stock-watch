name: Firecrawl anonymous probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/firecrawl-anonymous-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Probe Firecrawl without API key
        shell: bash
        run: |
          node - <<'NODE'
          const response = await fetch("https://api.firecrawl.dev/v2/scrape", {
            method: "POST",
            headers: {"content-type":"application/json"},
            body: JSON.stringify({
              url: "https://www.hermes.com/us/en/category/leather-goods/bags-and-clutches/womens-bags-and-clutches/",
              formats: ["markdown"],
              proxy: "basic",
              maxAge: 0,
              waitFor: 2000,
              onlyMainContent: false,
              removeBase64Images: true
            })
          });
          const text = await response.text();
          console.log("STATUS", response.status);
          console.log(text.slice(0, 1200));
          NODE
