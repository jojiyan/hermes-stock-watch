name: Firecrawl CLI formats probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/firecrawl-cli-formats-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Probe markdown plus rawHtml output
        shell: bash
        run: |
          npx -y firecrawl-cli@latest scrape "https://www.hermes.com/us/en/product/neo-garden-23-bag-H088612CKAO/" --format markdown,rawHtml -o /tmp/product.json
          echo "BYTES=$(wc -c < /tmp/product.json)"
          node - <<'NODE'
          const fs = require("fs");
          const text = fs.readFileSync("/tmp/product.json","utf8");
          console.log("PREVIEW", text.slice(0,800));
          try {
            const j=JSON.parse(text);
            console.log("KEYS", Object.keys(j));
            console.log("MARKDOWN", (j.markdown||j.data?.markdown||"").length);
            console.log("RAWHTML", (j.rawHtml||j.data?.rawHtml||"").length);
            console.log("STATUS", j.metadata?.statusCode || j.data?.metadata?.statusCode || "");
          } catch(e) {
            console.log("PARSE_ERROR", e.message);
          }
          NODE
