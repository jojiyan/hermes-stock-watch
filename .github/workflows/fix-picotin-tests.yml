name: Fix Picotin tests once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-picotin-tests.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update fixtures for Picotin target
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('test/check.test.mjs')
          s = p.read_text()
          old = "[${i === 0 && target ? 'Kelly 25 bag' : 'Picotin bag'}]"
          new = "[${i === 0 && target ? 'Kelly 25 bag' : 'So Medor bag'}]"
          if old not in s:
              raise SystemExit('check.test filler pattern not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('test/hermes.test.mjs')
          s = p.read_text()
          wanted_old = '    "Mini Lindy bag",\n    "Birkin 25 bag",'
          wanted_new = '    "Mini Lindy bag",\n    "Picotin Lock 18 bag",\n    "Birkin 25 bag",'
          if wanted_old not in s:
              raise SystemExit('wanted insertion point not found')
          s = s.replace(wanted_old, wanted_new, 1)
          unwanted_old = '    "Garden Party 49 voyage bag",\n    "Picotin Lock 18 bag",\n    "Lindy 26 bag",'
          unwanted_new = '    "Garden Party 49 voyage bag",\n    "Lindy 26 bag",'
          if unwanted_old not in s:
              raise SystemExit('unwanted Picotin pattern not found')
          s = s.replace(unwanted_old, unwanted_new, 1)
          expectation = '  assert.equal(products[2].target, false);'
          if expectation not in s:
              raise SystemExit('Picotin target expectation not found')
          s = s.replace(expectation, '  assert.equal(products[2].target, true);', 1)
          p.write_text(s)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/check.test.mjs test/hermes.test.mjs
          git commit -m "test: align fixtures with Picotin monitoring"
          git push
