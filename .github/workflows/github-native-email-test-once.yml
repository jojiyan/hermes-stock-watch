name: One-time GitHub Notification Delivery Test
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/github-native-email-test-once.yml"

permissions:
  contents: read
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Create a non-stock GitHub Issue and assign the owner
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const marker = `<!-- github-email-delivery-check-${context.runId} -->`;
            const title = "【通知送达测试｜不是有货】Hermès GitHub Issue 提醒测试";
            const body = [
              `@${owner}`,
              "",
              "这是库存监控的 GitHub 原生通知**送达测试**，不是商品上架，也不会改变任何库存记录。",
              "",
              "这条 Issue 由 GitHub Actions 机器人创建，并指派给仓库所有者，以复现真实有货提醒的触发方式。",
              "请检查你在 GitHub Notifications 中设置的那个 **3 开头的 QQ 通知邮箱**，查找来自 notifications@github.com 的消息。",
              "未收到时，请确认 GitHub Settings → Notifications → Default notifications email，以及 Participating → Email 已启用。",
              "",
              marker
            ].join("\n");
            const issue = await github.rest.issues.create({
              owner, repo, title, body, assignees: [owner]
            });
            core.notice(`Created non-stock notification test Issue: ${issue.data.html_url}`);
