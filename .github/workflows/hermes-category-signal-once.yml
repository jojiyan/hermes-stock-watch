name: Hermès Category Signal One-Shot
on:
  push:
    branches: [main]
    paths: [".github/workflows/hermes-category-signal-once.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Inspect US category response for stock signals
        run: node src/category-signal-once.mjs
        env:
          SCRAPINGANT_API_KEY: ${{ secrets.SCRAPINGANT_API_KEY }}
