name: Hermes Direct Probe

on:
  push:
    branches: [main]
    paths:
      - "src/direct-probe.py"
      - ".github/workflows/hermes-direct-probe.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser-fingerprint HTTP client
        run: pip install --disable-pip-version-check curl_cffi
      - name: Probe Hermès US and CA directly
        run: python src/direct-probe.py
