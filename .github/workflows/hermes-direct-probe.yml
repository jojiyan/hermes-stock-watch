name: Hermes Direct Probe

on:
  push:
    branches: [main]
    paths:
      - "src/direct-probe.py"
      - "src/wreq-probe.mjs"
      - ".github/workflows/hermes-direct-probe.yml"
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install wreq browser-fingerprint client
        run: npm install --no-save wreq-js
      - name: Probe Hermès official JSON API
        run: node src/wreq-probe.mjs
