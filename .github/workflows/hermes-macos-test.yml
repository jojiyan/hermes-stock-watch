name: Hermes macOS access test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hermes-macos-test.yml"

jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run tests
        run: npm test
      - name: Dry-run live monitor
        run: node src/monitor.mjs
        env:
          DRY_RUN: "1"
