name: Hermès Historical Missed Alert Resend (One Time)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hermes-missed-alert-resend-once.yml"

permissions:
  contents: read
  issues: write

jobs:
  resend:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Resend historical Neo Garden 23 alert using GitHub's native notification
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const marker = "<!-- historical-stock-resend-H086422CK37-2026-10-08 -->";
            const {data:issues} = await github.rest.issues.listForRepo({owner, repo, state:"all", per_page:100});
            if (issues.some(issue => issue.body?.includes(marker))) {
              core.notice("Historical alert was already resent; avoiding duplication.");
              return;
            }
            const title = "【补发历史记录｜不是现在有货】Neo Garden 23 米白 Beige/Natural（10月8日）";
            const body = [
              `@${owner}`,
              "",
              "**这是历史上架提醒的补发，不代表目前仍有库存。**",
              "",
              "10 月 8 日上午 6:40（温哥华时间），美国 Hermès 官网曾验证到该商品的购买按钮，但你反馈原始邮件未收到。",
              "",
              "- 包款：Neo Garden 23 bag",
              "- 颜色：Beige/Natural（米白/自然色）",
              "- 价格：US$4,475（当时记录）",
              "- SKU：H086422CK37",
              "- 当时的官网链接：https://www.hermes.com/us/en/product/neo-garden-23-bag-H086422CK37/",
              "- 历史 Issue：https://github.com/jojiyan/hermes-stock-watch/issues/5",
              "",
              "当前有货状态未确认；商品是否为全皮版本也尚未核实。请勿据此判断现在可以购买。",
              "这条补发只测试并提醒 GitHub 通知邮件，没有修改库存监控或库存状态。",
              "",
              marker
            ].join("\n");
            const {data:issue}=await github.rest.issues.create({
              owner,repo,title,body,assignees:[owner]
            });
            core.notice("Historical missed stock alert resent: "+issue.html_url);
