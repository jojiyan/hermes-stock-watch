name: Hermes Stock Watch (Scrapling - zero credits)

on:
  push:
    branches: [main]
    paths:
      - src/direct-monitor.mjs
      - src/scrapling_fetch.py
      - src/hermes.mjs
      - src/check.mjs
      - .github/workflows/hermes-stock-watch-ant.yml
  schedule:
    - cron: '3-53/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: hermes-stock-watch-scrapling
  cancel-in-progress: false

jobs:
  check-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned open-source fetcher
        run: |
          test -x /usr/bin/google-chrome-stable
          python3 -m venv .venv
          .venv/bin/python -m pip install --quiet 'scrapling[fetchers]==0.4.15'
      - name: Check stock safety rules
        run: |
          npm test
          .venv/bin/python -m py_compile src/scrapling_fetch.py
      - name: Verify US and Canada with Scrapling
        id: monitor
        continue-on-error: true
        run: node src/direct-monitor.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
      - name: Save verified stock and market health
        if: always() && steps.monitor.outcome != 'skipped'
        shell: bash
        run: |
          if git diff --quiet -- direct-state.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add direct-state.json
          git commit -m 'chore: update Scrapling stock state [skip ci]'
          if ! git push; then
            git pull --rebase origin main
            git push
          fi
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrapling-verification-${{ github.run_id }}
          path: direct-run-report.json
          retention-days: 3
      - name: Require a completed monitor process
        if: always()
        env:
          MONITOR_OUTCOME: ${{ steps.monitor.outcome }}
        run: test "$MONITOR_OUTCOME" = success
