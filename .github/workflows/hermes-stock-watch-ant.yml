name: Hermes Stock Watch (direct browser)

on:
  schedule:
    # Wake every 5 minutes; the freshness gate runs a real US+CA check only
    # when the older successful market check is at least 8 minutes old.
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/direct-monitor.mjs"
      - ".github/workflows/hermes-stock-watch-ant.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: hermes-stock-watch-direct
  cancel-in-progress: false

jobs:
  check-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out monitor
        uses: actions/checkout@v4

      - name: Decide whether verification is due
        id: due
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" != "schedule" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Manual/push run: verification is due."
            exit 0
          fi

          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone

          should_run = True
          reason = "new or unhealthy state"
          try:
              with open("direct-state.json", "r", encoding="utf-8") as f:
                  state = json.load(f)
              success_times = []
              for code in ("US", "CA"):
                  market = state.get("markets", {}).get(code, {})
                  if market.get("status") != "ok" or not market.get("lastSuccessAt"):
                      raise ValueError(f"{code} is not healthy")
                  success_times.append(datetime.fromisoformat(market["lastSuccessAt"].replace("Z", "+00:00")).astimezone(timezone.utc))
              age = (datetime.now(timezone.utc) - min(success_times)).total_seconds()
              if age < 8 * 60:
                  should_run = False
                  reason = f"both markets were verified {age:.0f}s ago"
              else:
                  reason = f"last complete verification is {age:.0f}s old"
          except Exception as exc:
              reason = f"verification due: {exc}"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"should_run={'true' if should_run else 'false'}\n")
          print(reason)
          PY

      - name: Use Node.js 22
        if: steps.due.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Confirm Chrome is available
        if: steps.due.outputs.should_run == 'true'
        shell: bash
        run: |
          for c in /usr/bin/google-chrome-stable /usr/bin/google-chrome /usr/bin/chromium /usr/bin/chromium-browser; do
            if [[ -x "$c" ]]; then
              echo "Chrome found: $c"
              "$c" --version
              exit 0
            fi
          done
          echo "No Chrome/Chromium binary found" >&2
          exit 1

      - name: Syntax check
        if: steps.due.outputs.should_run == 'true'
        run: node --check src/direct-monitor.mjs

      - name: Check Hermes US and Canada directly with Chrome
        if: steps.due.outputs.should_run == 'true'
        id: monitor
        continue-on-error: true
        run: node src/direct-monitor.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}

      - name: Save direct-browser stock state
        if: steps.due.outputs.should_run == 'true'
        shell: bash
        run: |
          if git diff --quiet -- direct-state.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add direct-state.json
          git commit -m "chore: update direct-browser stock state [skip ci]"
          git push

      - name: Retain verification evidence
        if: steps.due.outputs.should_run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: direct-market-verification-${{ github.run_id }}
          path: direct-run-report.json
          retention-days: 7

      - name: Require both markets to be verified
        if: steps.due.outputs.should_run == 'true' && always()
        env:
          MONITOR_OUTCOME: ${{ steps.monitor.outcome }}
        run: test "$MONITOR_OUTCOME" = success

      - name: Verification still fresh
        if: steps.due.outputs.should_run != 'true'
        run: echo "Skipping this wake-up because US and CA were both verified recently."
