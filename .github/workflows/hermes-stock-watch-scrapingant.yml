name: Hermes Stock Watch (ScrapingAnt)

on:
  schedule:
    - cron: "3-58/5 * * * *"
  push:
    branches: [main, fix/ca-catalog-pagination]
    paths:
      - 'src/ant-*.mjs'
      - 'test/ant-*.test.mjs'
      - '.github/workflows/hermes-stock-watch-scrapingant.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: hermes-stock-watch-scrapingant-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out monitor
        uses: actions/checkout@v4

      - name: Check ScrapingAnt configuration
        id: configured
        shell: bash
        env:
          SCRAPINGANT_API_KEY: ${{ secrets.SCRAPINGANT_API_KEY }}
        run: |
          if [[ -n "$SCRAPINGANT_API_KEY" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::error::SCRAPINGANT_API_KEY is not configured."
            exit 1
          fi

      - name: Use Node.js 22
        if: steps.configured.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run stock safety regressions
        if: steps.configured.outputs.ready == 'true'
        run: npm test

      - name: Syntax check
        if: steps.configured.outputs.ready == 'true'
        run: node --check src/ant-catalog-monitor.mjs

      - name: Execute scan and persist independent market observations
        if: steps.configured.outputs.ready == 'true'
        id: monitor
        run: node src/ant-catalog-monitor.mjs
        env:
          VERIFY_ONLY: ${{ github.event_name == 'push' || github.ref != 'refs/heads/main' }}
          SCRAPINGANT_API_KEY: ${{ secrets.SCRAPINGANT_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}

      - name: Save ScrapingAnt stock state
        if: always() && steps.configured.outputs.ready == 'true' && steps.monitor.outputs.state_written == 'true' && github.event_name != 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          if git diff --quiet -- ant-state.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ant-state.json
          git commit -m "chore: update ScrapingAnt stock state [skip ci]"
          if ! git push; then
            git pull --rebase origin main
            git push
          fi

      - name: Retain verification evidence
        if: steps.configured.outputs.ready == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: scrapingant-market-verification-${{ github.run_id }}
          path: |
            ant-run-report.json
            ant-evidence/
          retention-days: 7

      - name: Require current US and CA verification
        if: steps.configured.outputs.ready == 'true' && always()
        env:
          MONITOR_OUTCOME: ${{ steps.monitor.outcome }}
          VERIFICATION_STATUS: ${{ steps.monitor.outputs.verification_status }}
        run: |
          if [[ "$MONITOR_OUTCOME" != success ]]; then
            echo "::error::Monitor execution failed or was skipped; see execution step."
            exit 1
          fi
          if [[ "$VERIFICATION_STATUS" != verified ]]; then
            echo "::error::Scan completed but market verification failed; historical stock is not current availability. See ant-run-report.json."
            exit 1
          fi

      - name: ScrapingAnt key not configured
        if: steps.configured.outputs.ready != 'true'
        run: echo "SCRAPINGANT_API_KEY missing; scheduled run skipped."

