name: Hermes Stock Watch v2

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "test/**"
      - "package.json"
      - ".github/workflows/hermes-stock-watch-v2.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: hermes-stock-watch-v2
  cancel-in-progress: true

jobs:
  check-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIRECRAWL_CLI: "1"
    steps:
      - name: Check out monitor
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Firecrawl CLI
        run: npm install --global firecrawl-cli@latest

      - name: Run safety tests
        run: npm test

      - name: Check Hermes US and Canada through Firecrawl
        run: node src/monitor.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}

      - name: Save stock state
        shell: bash
        run: |
          if git diff --quiet -- state.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "chore: update stock state [skip ci]"
          git push

      - name: Send secondary QQ email alert
        if: ${{ hashFiles('email-alerts.json') != '' }}
        continue-on-error: true
        shell: bash
        env:
          HERMES_EMAIL_CONFIG: ${{ secrets.HERMES_EMAIL_CONFIG }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import smtplib
          from email.message import EmailMessage

          raw = os.environ.get("HERMES_EMAIL_CONFIG", "").strip()
          if not raw:
              print("Secondary email is not configured; skipping.")
              raise SystemExit(0)

          parts = raw.split("|", 2)
          if len(parts) != 3:
              raise SystemExit("HERMES_EMAIL_CONFIG must be FROM|TO|QQ_SMTP_AUTH_CODE")

          sender, recipient, auth_code = parts
          with open("email-alerts.json", "r", encoding="utf-8") as f:
              payload = json.load(f)

          alerts = payload.get("alerts") or []
          if not alerts:
              raise SystemExit(0)

          lines = [
              "Hermès 官网监控确认以下目标包款当前可在线购买：",
              "",
          ]
          for p in alerts:
              lines.extend([
                  f"地区：{p.get('marketName') or p.get('market') or ''}",
                  f"包款：{p.get('name') or ''}",
                  f"颜色：{p.get('color') or ''}",
                  f"材质：{p.get('material') or ''}",
                  f"价格：{p.get('price') or ''}",
                  f"SKU：{p.get('sku') or ''}",
                  f"购买链接：{p.get('url') or ''}",
                  "",
              ])

          lines.extend([
              f"检测时间：{payload.get('checkedAt') or ''}",
              "",
              "同一库存状态只提醒一次；售罄后再次补货会重新提醒。",
          ])

          subject_names = " / ".join(
              [p.get("name", "") for p in alerts[:3] if p.get("name")]
          )
          subject = "Hermès 有货提醒"
          if subject_names:
              subject += "｜" + subject_names

          msg = EmailMessage()
          msg["From"] = sender
          msg["To"] = recipient
          msg["Subject"] = subject
          msg.set_content("\n".join(lines))

          with smtplib.SMTP_SSL("smtp.qq.com", 465, timeout=30) as smtp:
              smtp.login(sender, auth_code)
              smtp.send_message(msg)

          print("Secondary stock email sent successfully.")
          PY
