name: Hermes Stock Watch v2

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "test/**"
      - "package.json"
      - ".github/workflows/hermes-stock-watch-v2.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: hermes-stock-watch-v2
  cancel-in-progress: false

jobs:
  check-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
    steps:
      - name: Check out monitor
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run safety tests
        run: npm test

      - name: Firecrawl not configured yet
        if: env.FIRECRAWL_API_KEY == ''
        run: echo "FIRECRAWL_API_KEY is not configured; live stock check skipped."

      - name: Check Hermes US and Canada through Firecrawl
        if: env.FIRECRAWL_API_KEY != ''
        run: node src/monitor.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}

      - name: Save stock state
        if: env.FIRECRAWL_API_KEY != ''
        shell: bash
        run: |
          if git diff --quiet -- state.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "chore: update stock state [skip ci]"
          git push
