name: Hermes Stock Watch (Firecrawl)

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/hermes.mjs"
      - "src/check.mjs"
      - "src/monitor.mjs"
      - "bin/firecrawl"
      - "test/**"
      - ".github/workflows/hermes-stock-watch-v2.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: hermes-stock-watch-firecrawl
  cancel-in-progress: false

jobs:
  check-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIRECRAWL_CLI: "1"
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
    steps:
      - name: Check out monitor
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Firecrawl CLI
        run: npm install --global firecrawl-cli@latest

      - name: Configure resilient Firecrawl wrapper
        shell: bash
        run: |
          real_cli="$(command -v firecrawl)"
          test -n "$real_cli"
          echo "FIRECRAWL_REAL_CLI=$real_cli" >> "$GITHUB_ENV"
          chmod +x "$GITHUB_WORKSPACE/bin/firecrawl"
          echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"

      - name: Run safety tests
        run: npm test

      - name: Check Hermes US and Canada through Firecrawl
        id: monitor
        continue-on-error: true
        run: node src/monitor.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}

      - name: Save stock state
        shell: bash
        run: |
          if git diff --quiet -- state.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "chore: update stock state [skip ci]"
          if ! git push; then
            git pull --rebase origin main
            git push
          fi

      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-verification-${{ github.run_id }}
          path: run-report.json
          retention-days: 7

      - name: Require both markets to be verified
        if: always()
        env:
          MONITOR_OUTCOME: ${{ steps.monitor.outcome }}
        run: test "$MONITOR_OUTCOME" = success
