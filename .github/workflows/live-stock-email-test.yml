name: Hermes Live Stock Email Test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/live-stock-email-test.yml"

permissions:
  contents: read
  issues: write

jobs:
  send-live-stock-test:
    runs-on: ubuntu-latest
    steps:
      - name: Create live stock test issue as bot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          payload = {
            "title": "🟠 Hermès 有货【测试】｜US｜So Medor bag｜Grey",
            "body": "@jojiyan\n\n这是一次**完整链路测试**，模拟正式有货提醒。\n\nHermès 美国官网刚刚实时确认这个包当前可以购买：\n\n- 地区：United States\n- 包款：So Medor bag\n- 颜色：Grey\n- 价格：$8,400\n- SKU：H085054CK0L\n- 购买链接：https://www.hermes.com/us/en/product/so-medor-bag-H085054CK0L/\n- 验证结果：官方商品页存在启用状态的 Add to cart 按钮，且未显示 unavailable / sold out\n\n这不是正式库存状态写入，只用于测试 GitHub 邮件通知是否能送达你的默认通知邮箱。",
            "assignees": ["jojiyan"]
          }
          req = urllib.request.Request(
            f"https://api.github.com/repos/{os.environ['REPO']}/issues",
            data=json.dumps(payload).encode(),
            method="POST",
            headers={
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "hermes-stock-watch-live-test",
              "Content-Type": "application/json"
            }
          )
          with urllib.request.urlopen(req, timeout=30) as r:
            print(r.read().decode())
          PY
