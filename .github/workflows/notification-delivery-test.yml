name: Hermes Notification Delivery Test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/notification-delivery-test.yml"

permissions:
  contents: read
  issues: write

jobs:
  send-test:
    runs-on: ubuntu-latest
    steps:
      - name: Create bot notification test issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          payload = {
              "title": "【BOT TEST】Hermès 正式通知链测试",
              "body": "@jojiyan\n\n这是由 **github-actions[bot]** 创建的通知测试，模拟正式库存监控的通知方式。\n\n如果 GitHub 邮件设置正常，你应该收到这条 Issue 的邮件通知。\n\n这不是正式库存提醒。",
              "assignees": ["jojiyan"],
          }
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPO']}/issues",
              data=json.dumps(payload).encode(),
              method="POST",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "hermes-stock-watch-test",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(req, timeout=30) as r:
              print(r.read().decode())
          PY
