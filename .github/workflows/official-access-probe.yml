name: Hermes free access diagnostics
on:
  push:
    branches: [main]
    paths:
      - 'src/official-access-probe.py'
      - '.github/workflows/official-access-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet "scrapling[fetchers]==0.4.15"
      - run: python src/official-access-probe.py
